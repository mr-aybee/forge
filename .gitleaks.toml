# Secret scanning (gitleaks). Findings below are reviewed false positives:
# the release *public* key that installers pin, documentation placeholders,
# and recipes that read a password from the environment at run time.
[extend]
useDefault = true

[allowlist]
description = "Reviewed false positives"
paths = [
  '''target/''',
  '''node_modules/''',
  '''(^|/)dist/''',
]
regexes = [
  # The Ed25519 release public key, pinned on purpose.
  '''6yf7l7jBEw6u446vqWAgt7P7bqEuaY5tpbYnWPHBmbg''',
  # Documentation placeholder access key.
  '''FAK3X9Q2M7T1ZB6W4KHD''',
  # Package recipes: the password comes from the package environment.
  '''-u "elastic:\$\(pkg_env_get''',
  '''-u "admin:\$\(pkg_env_get''',
]

[package]
name = "forge-catalog"
description = "Orbyn Forge App Store catalog (package manifests, typed parameters, recipes) and service specs shared by the control plane and the node helper."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
forge-core.workspace = true
serde-saphyr = { workspace = true, optional = true }
schemars = { version = "1.2", default-features = false, features = ["derive", "std"], optional = true }

[features]
# Bounded YAML reading of Forge documents (server and CLI; not the agent).
yaml = ["dep:serde-saphyr"]
# JSON Schema for API inputs that embed catalog types (server only).
schema = ["dep:schemars"]

[lints]
workspace = true

[package]
name = "forge-cli"
description = "Orbyn Forge command-line client."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
forge-sdk.workspace = true
forge-catalog = { workspace = true, features = ["yaml"] }
forge-secrets.workspace = true
clap.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["io-std"] }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
ring.workspace = true
url.workspace = true
hex.workspace = true
# Local UTC offset for date-times in human output (adds the tiny
# `num_threads` on Unix; MIT/Apache-2.0).
time = { workspace = true, features = ["local-offset"] }
# Shell completion scripts generated from the command definitions (MIT/Apache-2.0).
clap_complete = "4.5"
# OS credential stores: Windows Credential Manager, macOS Keychain, Secret
# Service over pure-Rust zbus on Linux (MIT/Apache-2.0; no OpenSSL). Approved
# by the user for issue #5.
keyring = "4.2"
# Terminal and exec sessions (`forge nodes terminal|exec`, D-075): the
# WebSocket client over Forge's own rustls (ring) stream, the system's root
# certificates as reqwest uses them, and raw terminal mode on every OS.
# All MIT/Apache-2.0, no OpenSSL.
tokio-tungstenite = { workspace = true }
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
rustls-native-certs = { workspace = true }
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
futures.workspace = true
# `forge tunnel open --direct` (#35 phase 2): SSH straight to the node with a
# one-connection certificate. Already in the tree for the server; ring
# crypto, Apache-2.0, no OpenSSL.
russh.workspace = true
# Turns on ANSI colours in old Windows consoles (already in the tree via clap; MIT/Apache-2.0).
anstyle-query = "1.1"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="Orbyn Forge architecture: operators reach the control plane over HTTPS from the web console, the forge CLI and API clients; AI agents connect to its MCP endpoint with audience-bound OAuth tokens; agents on Linux, Windows and edge nodes dial out to it over mutual TLS, and upload their analytics spools to the analytics worker over mutual TLS on port 55132.">
  <!-- README architecture diagram. Self-contained dark card so it reads on GitHub light and dark themes. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2444"/>
      <stop offset=".6" stop-color="#0d3352"/>
      <stop offset="1" stop-color="#114a66"/>
    </linearGradient>
    <linearGradient id="cp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cc3dd" stop-opacity=".16"/>
      <stop offset="1" stop-color="#4cc3dd" stop-opacity=".05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.8"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8fdcf0"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #e6f3fb; }
      .h { font-size: 15px; font-weight: 700; }
      .t { font-size: 13px; font-weight: 600; }
      .s { font-size: 11px; fill: #a3c2d9; }
      .cap { font-size: 10.5px; font-weight: 700; letter-spacing: 1.6px; fill: #8fdcf0; }
      .lbl { font-size: 11px; fill: #bfe9f5; }
      .box { fill: #0f2440; stroke: #8fdcf0; stroke-opacity: .28; stroke-width: 1.2; }
      .chip { fill: #4cc3dd; fill-opacity: .12; stroke: #8fdcf0; stroke-opacity: .45; stroke-width: 1; }
      .line { stroke: #8fdcf0; stroke-width: 1.6; fill: none; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="960" height="500" rx="18" fill="url(#bg)"/>

  <!-- ===== Operators ===== -->
  <text class="cap" x="40" y="48">OPERATORS</text>
  <g>
    <rect class="box" x="40" y="66" width="180" height="62" rx="10"/>
    <text class="t" x="58" y="93">Web console</text>
    <text class="s" x="58" y="112">React · terminal · App Store</text>

    <rect class="box" x="40" y="142" width="180" height="62" rx="10"/>
    <text class="t" x="58" y="169">forge CLI</text>
    <text class="s" x="58" y="188">contexts · step-up · JSON</text>

    <rect class="box" x="40" y="218" width="180" height="62" rx="10"/>
    <text class="t" x="58" y="245">API keys · OIDC</text>
    <text class="s" x="58" y="264">CI pipelines, SSO, apps</text>
  </g>
  <!-- every operator client uses the same HTTPS API -->
  <path class="line" d="M220 97 H246 M220 173 H246 M220 249 H246 M246 97 V249"/>
  <path class="line" d="M246 130 H300" marker-end="url(#arr)"/>
  <text class="lbl" x="252" y="122">HTTPS</text>

  <!-- ===== AI agents ===== -->
  <text class="cap" x="40" y="306">AI AGENTS</text>
  <g>
    <rect class="box" x="40" y="316" width="180" height="62" rx="10"/>
    <text class="t" x="58" y="343">AI agents (MCP)</text>
    <text class="s" x="58" y="362">Claude · ChatGPT · Cursor</text>
  </g>
  <!-- connectors reach the MCP endpoint; tools dispatch through the API -->
  <path class="line" d="M220 347 H272 V152 H300" marker-end="url(#arr)"/>
  <text class="lbl" x="226" y="339">/mcp</text>
  <text class="s" x="40" y="397">OAuth consent in the console</text>
  <text class="s" x="40" y="412">read-only or auto · never MFA</text>

  <!-- ===== Control plane ===== -->
  <rect x="306" y="40" width="356" height="420" rx="16" fill="url(#cp)" stroke="#8fdcf0" stroke-opacity=".55" stroke-width="1.4"/>
  <!-- logo mark -->
  <g transform="translate(324 54) scale(.5)">
    <path d="M50 40V24a4 4 0 0 0-2-3.46l-14-8a4 4 0 0 0-4 0l-14 8A4 4 0 0 0 14 24v16a4 4 0 0 0 2 3.46l14 8a4 4 0 0 0 4 0l14-8A4 4 0 0 0 50 40z" fill="none" stroke="#8fdcf0" stroke-width="5" filter="url(#glow)" opacity=".5"/>
    <path d="M50 40V24a4 4 0 0 0-2-3.46l-14-8a4 4 0 0 0-4 0l-14 8A4 4 0 0 0 14 24v16a4 4 0 0 0 2 3.46l14 8a4 4 0 0 0 4 0l14-8A4 4 0 0 0 50 40z" fill="#4cc3dd" fill-opacity=".1" stroke="#8fdcf0" stroke-width="3.6" stroke-linejoin="round"/>
  </g>
  <text class="h" x="362" y="74">Forge control plane</text>
  <text class="s" x="362" y="92">forge-server · one per workspace</text>

  <rect class="box" x="326" y="110" width="316" height="54" rx="10"/>
  <text class="t" x="344" y="133">API · MCP endpoint · Cedar authorization</text>
  <text class="s" x="344" y="151">every request checked · MFA for sensitive actions</text>

  <rect class="box" x="326" y="176" width="152" height="62" rx="10"/>
  <text class="t" x="342" y="200">Durable jobs</text>
  <text class="s" x="342" y="218">resume after restart</text>

  <rect class="box" x="490" y="176" width="152" height="62" rx="10"/>
  <text class="t" x="506" y="200">Audit log</text>
  <text class="s" x="506" y="218">hash-chained, signed</text>

  <rect class="box" x="326" y="250" width="152" height="62" rx="10"/>
  <text class="t" x="342" y="274">PKI · SSH CA</text>
  <text class="s" x="342" y="292">mTLS certs, 5-min SSH</text>

  <rect class="box" x="490" y="250" width="152" height="62" rx="10"/>
  <text class="t" x="506" y="274">Plugin host</text>
  <text class="s" x="506" y="292">signed WASM sandbox</text>

  <rect class="box" x="326" y="324" width="316" height="54" rx="10"/>
  <text class="t" x="344" y="347">Agent hub</text>
  <text class="s" x="344" y="365">long-poll over HTTP/2 · authorizes every command</text>

  <rect class="chip" x="326" y="392" width="152" height="48" rx="10"/>
  <text class="t" x="342" y="414">Store</text>
  <text class="s" x="342" y="430">SQLite · PostgreSQL</text>

  <rect class="chip" x="490" y="392" width="152" height="48" rx="10"/>
  <text class="t" x="506" y="414">Analytics worker</text>
  <text class="s" x="506" y="430">logs, history · spool uploads</text>

  <!-- ===== Nodes ===== -->
  <text class="cap" x="730" y="48">WORKER NODES</text>
  <g>
    <rect class="box" x="730" y="66" width="190" height="70" rx="10"/>
    <text class="t" x="748" y="92">Linux node</text>
    <text class="s" x="748" y="110">forge-agent · ~17 MB RAM</text>
    <text class="s" x="748" y="125">Docker · databases · runtimes</text>

    <rect class="box" x="730" y="152" width="190" height="70" rx="10"/>
    <text class="t" x="748" y="178">Windows node</text>
    <text class="s" x="748" y="196">forge-agent as a service</text>
    <text class="s" x="748" y="211">.NET · SQL Server</text>

    <rect class="box" x="730" y="238" width="190" height="70" rx="10"/>
    <text class="t" x="748" y="264">Edge node</text>
    <text class="s" x="748" y="282">forge-agent + Nginx</text>
    <text class="s" x="748" y="297">sites, TLS, PowerDNS</text>
  </g>
  <!-- agents dial out to the hub -->
  <path class="line dash" d="M730 101 C 690 101, 700 345, 664 348" marker-end="url(#arr)"/>
  <path class="line dash" d="M730 187 C 696 187, 700 350, 664 351"/>
  <path class="line dash" d="M730 273 C 700 273, 700 354, 664 354"/>
  <!-- agents upload their analytics spools straight to the worker -->
  <path class="line dash" d="M730 124 C 694 124, 712 416, 644 416" marker-end="url(#arr)"/>
  <text class="lbl" x="730" y="346">mTLS · agents dial out</text>
  <text class="s" x="730" y="362">no inbound ports on nodes</text>

  <!-- footer legend -->
  <line x1="730" y1="400" x2="756" y2="400" class="line dash"/>
  <text class="s" x="764" y="404">outbound agent link</text>
  <line x1="730" y1="424" x2="756" y2="424" class="line" marker-end="url(#arr)"/>
  <text class="s" x="764" y="428">operator request</text>
  <text class="lbl" x="730" y="456">spool uploads · mTLS :55132</text>
  <text class="s" x="730" y="472">apps log to the node on :5341</text>
</svg>

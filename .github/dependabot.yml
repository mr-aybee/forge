version: 2
updates:
  - package-ecosystem: cargo
    directory: /src/forge
    schedule: { interval: weekly }
    target-branch: master
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directories: [/src/console, /docs]
    schedule: { interval: weekly }
    target-branch: master
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    target-branch: master

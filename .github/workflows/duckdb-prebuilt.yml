name: Prebuilt DuckDB

# Compiles DuckDB's bundled C++ (libduckdb-sys, about 20 minutes per target)
# once and publishes the compiled dependencies to GHCR as
#   ghcr.io/<owner>/forge-duckdb:<libduckdb-sys version>-<rustc version>-<target>
# release.yml restores it before building, so a release does not compile
# DuckDB again. Missing or mismatched artifacts only make the release slower
# (D-166). See docs: development/releases ("Prebuilt DuckDB").
#
# Runs when Cargo.lock, the toolchain or the build script changes on master,
# or by hand (Actions -> Prebuilt DuckDB -> Run workflow).

on:
  push:
    branches: [master]
    paths:
      - src/forge/Cargo.lock
      - src/forge/rust-toolchain.toml
      - scripts/ci/alpine.sh
      - .github/workflows/duckdb-prebuilt.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duckdb-prebuilt-${{ github.ref }}
  cancel-in-progress: true

env:
  FORGE_CI_BUILD_JOBS: 4
  FORGE_CI_CONTAINER_OPTS: --memory=14g --memory-swap=14g

jobs:
  build:
    name: DuckDB ${{ matrix.target }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Write access only to this repository's packages, to push the artifact.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        shell: bash
        run: |
          df -h / "$RUNNER_TEMP"
          free=$(df -k --output=avail "$GITHUB_WORKSPACE" | tail -1)
          [ "$free" -gt $((12 * 1024 * 1024)) ] || { echo "::error::less than 12 GiB free for the build; free space on the runner"; exit 1; }
      # The same first cargo command as the release, so the fingerprints match.
      - name: Build the release dependencies
        run: bash scripts/ci/alpine.sh build ${{ matrix.target }} --no-cli
      - name: Pack
        id: pack
        run: |
          echo "ref=$(bash scripts/ci/alpine.sh ref ${{ matrix.target }})" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/image"
          bash scripts/ci/alpine.sh pack ${{ matrix.target }} "$RUNNER_TEMP/image/prebuilt.tar.zst"
          # Free the build tree before docker copies the tarball.
          rm -rf src/forge/target/alpine/${{ matrix.target }}/release/forge* src/forge/target/alpine/${{ matrix.target }}/release/build/forge-*
      - name: Publish to GHCR
        env:
          REF: ${{ steps.pack.outputs.ref }}
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          printf 'FROM scratch\nCOPY prebuilt.tar.zst /prebuilt.tar.zst\n' > "$RUNNER_TEMP/image/Dockerfile"
          docker build -q -t "$REF" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.description=Prebuilt DuckDB for Orbyn Forge release builds" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            "$RUNNER_TEMP/image"
          docker push -q "$REF"
          echo "::notice::published $REF ($(du -h "$RUNNER_TEMP/image/prebuilt.tar.zst" | cut -f1))"

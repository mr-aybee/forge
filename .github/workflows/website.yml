# Builds the forge.orbyntech.com image (website at /, docs at /docs/) by
# hand, for a website or docs fix between releases. Release tags build and
# push the image in release.yml; pull requests and pushes only check that the
# website and docs build (ci.yml). Pushes
#   ghcr.io/<owner>/forge-website:<branch> and :sha-<short>.
# Heavy: it waits for the host build lock (scripts/ci/build.sh).
# Deploy by pulling the tag on the web host; see docs/development/website.
name: Website image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build and push
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
        run: |
          img="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/forge-website"
          tag=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9_.-' '-')
          bash scripts/ci/build.sh heavy docker buildx build -f website/Dockerfile \
            -t "$img:$tag" -t "$img:sha-${GITHUB_SHA::7}" --push .
      - name: Log out of GHCR
        if: always()
        shell: bash
        run: docker logout ghcr.io || true

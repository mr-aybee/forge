# cargo-deny policy. See DECISIONS.md D-010.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Marvin attack: timing leak in RSA *private-key* operations. `rsa` is
    # pulled in by `openidconnect`, which only verifies ID-token signatures
    # with the IdP's *public* key; Forge never holds an RSA private key.
    # Revisit when a patched `rsa` release exists. (DECISIONS.md D-012)
    { id = "RUSTSEC-2023-0071", reason = "public-key verification only; no RSA private keys in Forge" },
    # Bundled SQLite < 3.54: stale memory returned when a database is opened
    # with a crafted sibling -wal file. Forge opens only its own database in a
    # data directory restricted to the service user (0700); a party able to
    # write there already controls Forge. No sqlx release bundles the fix yet
    # (0.8.6 and 0.9.0 both pin libsqlite3-sys 0.30). Revisit on each sqlx
    # release. (DECISIONS.md D-032)
    { id = "RUSTSEC-2026-0459", reason = "only Forge's own 0700 data directory is opened; no patched sqlx yet" },
    # `zbus_names`, `zvariant`, `zvariant_derive` 4.x/5.x: "unmaintained"
    # (no vulnerability). They were merged into `zbus` 6 by the same
    # maintainers. Only the CLI's Linux credential store pulls them in
    # (`keyring` 4.2 -> `secret-service` 5 -> `zbus` 5); the server and agent
    # use `zbus` 6. `secret-service` 6 (on `zbus` 6) is only a release
    # candidate. Revisit when `keyring` ships a store on `secret-service` 6.
    { id = "RUSTSEC-2026-0370", reason = "unmaintained only; CLI keyring via secret-service 5; zbus 6 successor not released for it yet" },
    { id = "RUSTSEC-2026-0371", reason = "unmaintained only; CLI keyring via secret-service 5; zbus 6 successor not released for it yet" },
    { id = "RUSTSEC-2026-0372", reason = "unmaintained only; CLI keyring via secret-service 5; zbus 6 successor not released for it yet" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# MIT / Apache-2.0 / BSD, plus permissive licenses with equivalent terms.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

# 0BSD (public-domain equivalent) for quoted_printable only, via lettre (D-113).
[[licenses.exceptions]]
crate = "quoted_printable"
allow = ["0BSD"]

[[licenses.clarify]]
crate = "ring"
expression = "Apache-2.0 AND ISC"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# OpenSSL is excluded by policy (DECISIONS.md D-005).
deny = [
    { crate = "openssl-sys" },
    { crate = "openssl" },
    { crate = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
